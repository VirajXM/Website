<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Brand Details - ShreeShyamXM</title>

  <!-- Tailwind + Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root{
      --gold: #d4af37;
      --bg-dark: #0a0a0a;
      --card-dark: #0f0f0f;
    }

    html,body { margin:0; padding:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial; background:var(--bg-dark); color:var(--gold); -webkit-font-smooth:antialiased; -moz-osx-font-smoothing:grayscale; }

    /* Header: white background for contrast, keep logo visible */
    header.brand-header {
      background: #ffffff;
      color: #000;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:1rem;
      padding:0.6rem 1rem;
      border-radius:12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      margin-bottom:1rem;
    }
    header.brand-header .brand-title { color:#000; }
    header.brand-header img { height:72px; width:auto; object-fit:contain; }

    .container { max-width:1100px; margin:0 auto; padding:20px; }

    a { color:inherit; text-decoration:none; }
    .back-link { color:var(--gold); display:inline-flex; gap:.4rem; align-items:center; font-weight:700; padding:.4rem .6rem; border-radius:8px; border:1px solid rgba(212,175,55,0.08); background:transparent; }

    .card { background:var(--card-dark); padding:1.25rem; border-radius:12px; border:2px solid rgba(212,175,55,0.06); }

    /* Image area */
    .brand-media { display:flex; flex-direction:column; gap:0.75rem; }
    .brand-main-img {
      width:100%;
      height:420px;
      object-fit:contain;
      background:#fff;
      border-radius:10px;
      padding:12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .thumbs { display:flex; gap:0.5rem; flex-wrap:wrap; }
    .thumb {
      width:70px;
      height:70px;
      object-fit:cover;
      border-radius:8px;
      background:#fff;
      padding:6px;
      cursor:pointer;
      border:2px solid transparent;
      transition: transform .12s ease, border-color .12s ease;
    }
    .thumb.active { border-color:var(--gold); transform:translateY(-3px); }

    /* Buttons */
    .btn-gold { background: linear-gradient(135deg,var(--gold) 0%,#c9a227 100%); color:#000; padding:.6rem 1rem; border-radius:8px; font-weight:700; display:inline-flex; gap:.5rem; align-items:center; }
    .btn-gold:active{ transform: translateY(1px); }

    /* Layout */
    main#brandMain { display:grid; grid-template-columns: 1fr 1fr; gap:24px; align-items:start; }
    .brand-info h2 { color:var(--gold); margin:0 0 .5rem 0; }
    .brand-info p.sub { margin:0 0 1rem 0; color:#cfcfcf; }

    .specs { color:#e6e6e6; line-height:1.5; }

    /* Responsive */
    @media (max-width: 900px) {
      header.brand-header { flex-direction:column; align-items:flex-start; gap:.6rem; padding:.8rem; }
      .brand-main-img { height:320px; }
      main#brandMain { grid-template-columns: 1fr; gap:16px; }
      .thumb { width:56px; height:56px; padding:4px; }
    }

    @media (max-width: 480px) {
      .container { padding:12px; }
      header.brand-header img { height:60px; }
      .brand-main-img { height:240px; padding:8px; }
      .thumb { width:48px; height:48px; }
      .btn-gold { padding:.5rem .8rem; font-size:.9rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="brand-header" role="banner">
      <div style="display:flex;align-items:center;gap:12px;">
        <img src="images/LogoXM.png" alt="ShreeShyamXM Logo" />
        <div>
          <h1 class="brand-title text-2xl font-extrabold">ShreeShyamXM</h1>
          <p class="text-sm text-gray-600" style="color:#333;">Premium Spirits & Beverage Distribution</p>
        </div>
      </div>
      <div style="display:flex;gap:12px;align-items:center;">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Catalog</a>
      </div>
    </header>

    <main id="brandMain">
      <!-- Left: media -->
      <div id="brandImageWrap" class="card brand-media">
        <img id="brandImage" class="brand-main-img" src="images/Drinks.png" alt="Brand image" />

        <div id="thumbs" class="thumbs" aria-label="Brand images"></div>
      </div>

      <!-- Right: info -->
      <div id="brandInfo" class="card brand-info">
        <h2 id="brandName" class="text-3xl font-black mb-2">Brand</h2>
        <p id="brandCategory" class="sub"></p>

        <div id="brandDescription" class="specs mb-4"></div>

        <div class="mb-4">
          <strong style="color:var(--gold)">Sizes available:</strong>
          <span id="brandSizes" style="margin-left:.5rem;color:#e6e6e6;"></span>
        </div>

        <div class="space-y-3">
          <a id="contactSales" href="https://www.shreeshyamxm.com/#contact" class="btn-gold"><i class="fas fa-envelope"></i> Contact Sales</a>
          <a id="requestQuote" href="mailto:sales@shreeshyamxm.com?subject=Request%20Quote" class="btn-gold"><i class="fas fa-file-invoice"></i> Request Quote</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Brands map — images arrays: update the filenames to match how you've uploaded them.
    // For brands that span multiple categories we've created distinct keys per category (e.g. "aristocrat-whiskey", "aristocrat-brandy").
    const brands = {
      roulette: {
        key: 'roulette',
        name: "Roulette",
        images: [
          "Whiskey/Black_Roulette.png",
          "Whiskey/White_Roulette.png"
        ],
        category: "Whiskey",
        description: `<strong>Roulette Peated Premium Whisky</strong><br/>
        Type: Premium Blended Peated Whisky<br/>
        Origin: Goa, India<br/>
        Alcohol Strength: 42.8% ABV<br/>
        Blend: Premium Indian grain spirit with peated Indian single malt. Peat: Scottish peat used during malting. Maturation: American ex-bourbon charred casks.<br/>
        Colour: Deep Amber<br/>
        Nose: Sweet smoke, burnt sugar, honey and fruity notes.<br/>
        Palate: Rich malt, soft smoke, honey sweetness, grain and dried fruits.<br/>
        Finish: Long, warm, smoky and lingering.<br/>
        Serving Suggestion: Neat, on the rocks or with a splash of water.<br/><br/>
        <strong>Roulette Unpeated Premium Whisky</strong><br/>
        Type: Premium Blended Unpeated Whisky<br/>
        Alcohol Strength: 42.8% ABV<br/>
        Nose: Floral notes with vanilla, gentle spice and ripe fruits.<br/>
        Palate: Smooth vanilla, caramel, orchard fruits, toasted nuts and creamy malt.<br/>
        Finish: Long, smooth, creamy and well-balanced.`,
        sizes: "750 ml, 200 ml, 180 ml, 60 ml"
      },

      dennis: {
        key: 'dennis',
        name: "Dennis",
        images: [
          "Whiskey/Dennis.png"
        ],
        category: "Whiskey",
        description: `<strong>Dennis Special Whisky</strong><br/>
        Smooth blended whisky with mild peaty notes, vibrant golden colour, gentle aroma, and a warm, clean finish. ABV: 42.8% (market dependent).`,
        sizes: "750 ml"
      },

      goanas: {
        key: 'goanas',
        name: "Goana's",
        images: [
          "Wine/Goanas.jpg"
        ],
        category: "Wine",
        description: `<strong>Goana's Wine</strong><br/>
        Premium fortified wine crafted to deliver a rich, smooth, and satisfying drinking experience. Best for retail and hospitality markets.`,
        sizes: "750 ml"
      },

      "montcastle-whiskey": {
        key: 'montcastle-whiskey',
        name: "Mont Castle (Whisky)",
        images: [
          "Whiskey/Mont_Castle_Black.png",
          "Whiskey/Mont_Castle_Red.png"
        ],
        category: "Whiskey",
        description: `<strong>Mont Castle Whisky</strong><br/>
        Premium blended whisky ranges crafted for consistent quality. Matured in selected oak casks. Flavour profile: balanced malt, vanilla, caramel and mild oak. Suitable for wholesale packaging and palletized distribution.`,
        sizes: "180 ml, 375 ml, 750 ml"
      },

      "montcastle-brandy": {
        key: 'montcastle-brandy',
        name: "Mont Castle (Brandy)",
        images: [
          "Brandy/Mont_Castle_Brandy.png"
        ],
        category: "Brandy",
        description: `<strong>Mont Castle Brandy</strong><br/>
        Premium brandy range matured in oak casks. Notes of dried fruits, vanilla and gentle oak carry through to a smooth finish. Suitable for retail and hospitality markets.`,
        sizes: "180 ml, 375 ml, 750 ml"
      },

      "aristocrat-whiskey": {
        key: 'aristocrat-whiskey',
        name: "Aristocrat (Whisky)",
        images: [
          "Whiskey/AC_Black.jpeg",
          "Whiskey/AC_Neat_Whiskey.jpeg",
          "Whiskey/AC_Premium_Whiskey.jpeg"
        ],
        category: "Whiskey",
        description: `<strong>Aristocrat Premium Whiskies</strong><br/>
        Type: Blended Whisky (IMFL). Profile: Golden amber, mellow grain, caramel, vanilla and subtle oak notes. Sizes commonly available: 180 ml, 375 ml, 750 ml (and 1L in some markets).`,
        sizes: "180 ml, 375 ml, 750 ml, 1 L"
      },

      "aristocrat-rum": {
        key: 'aristocrat-rum',
        name: "Aristocrat (Rum)",
        images: [
          "Rum/AC_Rum.jpeg"
        ],
        category: "Rum",
        description: `<strong>Aristocrat Rum</strong><br/>
        Premium rum range with balanced molasses character, suitable for mixed drinks and retail markets.`,
        sizes: "180 ml, 375 ml, 750 ml"
      },

      "aristocrat-brandy": {
        key: 'aristocrat-brandy',
        name: "Aristocrat (Brandy)",
        images: [
          "Brandy/AC_Brandy.jpeg"
        ],
        category: "Brandy",
        description: `<strong>Aristocrat Brandy</strong><br/>
        Spirit Type: Brandy. Appearance: Rich amber. Aroma: Dried fruits, vanilla, caramel and subtle oak. Finish: Warm, smooth and lingering.`,
        sizes: "180 ml, 375 ml, 750 ml"
      },

      ice: {
        key: 'ice',
        name: "Ice",
        images: [
          "Vodka/Ice_vodka.png"
        ],
        category: "Vodka",
        description: `<strong>Ice Vodka</strong><br/>
        Premium vodka triple distilled from 100% pure grain spirit. Flavours include Original and flavoured variants. ABV varies by market.`,
        sizes: "180 ml, 375 ml, 750 ml"
      },

      "kamanda-whiskey": {
        key: 'kamanda-whiskey',
        name: "Kamanda (Whisky)",
        images: [
          "Whiskey/Kamanda_Whiskey.png"
        ],
        category: "Whiskey",
        description: `<strong>Kamanda Premium Café Rhum Whisky</strong><br/>
        Category: Coffee-Flavoured Whisky (Café Rhum profile). Alcohol Strength: 45% ABV. Nose: Roasted coffee, vanilla and nutty notes with Jamaican-style rum character.`,
        sizes: "1000 ml, 750 ml, 500 ml, 250 ml, 180 ml, 90 ml"
      },

      "kamanda-rum": {
        key: 'kamanda-rum',
        name: "Kamanda (Rum)",
        images: [
          "Rum/Kamanda_Cafe_Rum.png"
        ],
        category: "Rum",
        description: `<strong>Kamanda Rum</strong><br/>
        Premium rum ranges including café and spiced variants. Rich aromatic profile, suitable for hospitality and retail.`,
        sizes: "1000 ml, 750 ml, 500 ml, 250 ml, 180 ml, 90 ml"
      },

      "kamanda-gin": {
        key: 'kamanda-gin',
        name: "Kamanda (Gin)",
        images: [
          "Gin/Kamanda_Gin.png"
        ],
        category: "Gin",
        description: `<strong>Kamanda Gin</strong><br/>
        Premium gin variant with botanical-forward profile. Suitable for craft cocktails and retail.`,
        sizes: "750 ml, 375 ml, 180 ml"
      }
    };

    // Utility to get query param
    function getQueryParam(param) {
      try {
        const url = new URL(window.location.href);
        return url.searchParams.get(param);
      } catch(e) {
        return null;
      }
    }

    // Render brand
    function renderBrand(brandKey) {
      const data = brands[brandKey];
      const brandNameEl = document.getElementById('brandName');
      const brandImage = document.getElementById('brandImage');
      const brandCategory = document.getElementById('brandCategory');
      const brandDescription = document.getElementById('brandDescription');
      const brandSizes = document.getElementById('brandSizes');
      const thumbsEl = document.getElementById('thumbs');

      // Clear thumbs
      thumbsEl.innerHTML = '';

      if (!data) {
        brandNameEl.textContent = "Brand Not Found";
        brandImage.src = "images/Drinks.png";
        brandImage.alt = "Not found";
        brandCategory.textContent = "";
        brandDescription.textContent = "We couldn't find the brand you requested. Please return to the catalog and pick a valid brand.";
        brandSizes.textContent = "";
        return;
      }

      brandNameEl.textContent = data.name;
      brandCategory.innerHTML = "<strong style='color:var(--gold)'>Category:</strong> " + data.category;
      // Render HTML description (specs)
      brandDescription.innerHTML = data.description;
      brandSizes.textContent = data.sizes || "";

      // Determine main image and thumbnails
      const images = Array.isArray(data.images) && data.images.length ? data.images : ["images/Drinks.png"];
      // set first image as main
      brandImage.src = images[0];
      brandImage.alt = data.name + " image";

      images.forEach((src, idx) => {
        const img = document.createElement('img');
        img.src = src;
        img.alt = data.name + " image " + (idx+1);
        img.className = 'thumb' + (idx === 0 ? ' active' : '');
        img.addEventListener('click', () => {
          // swap main
          brandImage.src = src;
          // update active class
          thumbsEl.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
          img.classList.add('active');
        });
        thumbsEl.appendChild(img);
      });
    }

    // Initialize on DOMContentLoaded
    document.addEventListener('DOMContentLoaded', function() {
      const brandKey = (getQueryParam('brand') || '').toLowerCase();
      renderBrand(brandKey);
    });
  </script>
</body>
</html>
